<div style="max-width: 400px" class="mx-auto">
  <h1>Criar conta</h1>

  {{ALERTA}}

  <form method="post" action="/cadastro">
    <div class="mb-3">
      <label class="form-label" for="nome">Nome</label>
      <input class="form-control" id="nome" name="nome" value="{{NOME}}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">E-mail</label>
      <input class="form-control" id="email" name="email" type="email" value="{{EMAIL}}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="login">Login</label>
      <input class="form-control" id="login" name="login" value="{{LOGIN}}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="senha">Senha</label>
      <input class="form-control" id="senha" name="senha" type="password" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="data_nasc">Data de nascimento</label>
      <input class="form-control" id="data_nasc" name="data_nasc" type="date" value="{{DATA_NASC}}">
    </div>
    <button class="btn btn-primary w-100">Cadastrar</button>
  </form>

  <p class="mt-3 text-center">Já tem conta? <a href="/login">Entrar</a></p>
</div>
