<div style="max-width: 400px">
  <a href="/minha-conta" class="text-decoration-none">&larr; Minha conta</a>
  <h1 class="mt-1 mb-3">Alterar senha</h1>

  {{ALERTA}}

  <form method="post" action="/minha-conta/senha">
    <div class="mb-3">
      <label class="form-label" for="senha_atual">Senha atual</label>
      <input class="form-control" id="senha_atual" name="senha_atual" type="password" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="nova_senha">Nova senha</label>
      <input class="form-control" id="nova_senha" name="nova_senha" type="password" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="confirmacao">Confirme a nova senha</label>
      <input class="form-control" id="confirmacao" name="confirmacao" type="password" required>
    </div>
    <button class="btn btn-primary">Alterar senha</button>
    <a class="btn btn-secondary" href="/minha-conta">Cancelar</a>
  </form>
</div>
