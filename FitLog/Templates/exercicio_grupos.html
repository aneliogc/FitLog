<div class="mb-3">
  <a href="/exercicios" class="text-decoration-none">&larr; Exercícios</a>
  <h1 class="mt-1">Grupos de {{EXERCICIO}}</h1>
</div>

{{ALERTA}}

<table class="table table-striped align-middle">
  <thead>
    <tr><th>Grupo muscular</th><th>Papel</th><th></th></tr>
  </thead>
  <tbody>
    {{LINHAS}}
  </tbody>
</table>

<h2 class="h5 mt-4">Incluir grupo secundário</h2>
<form method="post" action="/exercicios/grupos/incluir" class="d-flex gap-2" style="max-width: 500px">
  <input type="hidden" name="id" value="{{ID}}">
  <select class="form-select" name="id_grupo" required>
    <option value="">Selecione...</option>
    {{OPCOES_GRUPO}}
  </select>
  <button class="btn btn-primary">Incluir</button>
</form>
<div class="form-text">Para trocar o grupo principal, inclua o novo grupo como secundário e use "Tornar principal".</div>
